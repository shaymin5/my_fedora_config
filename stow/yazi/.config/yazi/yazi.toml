[mgr]
show_hidden = false
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"

[preview]
max_width = 10000
max_height = 10000
# image_quality = 900

[plugin]
prepend_previewers = [
  # Directory preview: `T` toggles between one level and a tree.
  { url = "*/", run = "folder-tree" },
  # Large ZIPs (>7 MiB) are misdetected by file/libmagic 5.46 as
  # application/octet-stream, so match the extension as a fallback.
  { url = "*.{zip,zipx,cbz}", run = "archive" },
  { mime = "image/*", run = "image" },
]

[open]
prepend_rules = [
  # Same libmagic limitation: without this, Enter hits the generic
  # application/octet-stream rule below instead of extracting.
  { url = "*.{zip,zipx,cbz}", use = "extract" },
  # Empty spreadsheet files likewise fall back to LibreOffice Calc
  # (this also catches plain-text CSVs that file reports as text/plain).
  { url = "*.{xls,xlsx,xlsm,xlsb,xlt,xltx,xltm,ods,ots,csv}", use = "excel" },
  # Empty files (e.g. `touch new.docx`) are detected as `inode/x-empty`
  # by file/libmagic, so match document extensions as a fallback.
  { url = "*.{doc,docx,docm,dotx,dotm,odt,ott,rtf,fodt}", use = "doc" },
]
rules = [
  # Excel (must come BEFORE the generic "text/*" rule below:
  # yazi picks the first matching rule, so text/* would otherwise swallow text/csv)
  # NOTE: Yazi's mime.local plugin strips the `vnd.` prefix from MIME types,
  # so these patterns use the normalized forms (e.g. application/vnd.ms-excel
  # is seen as application/ms-excel).
  { mime = "application/openxmlformats-officedocument.spreadsheetml.sheet", use = "excel" },
  { mime = "application/ms-excel", use = "excel" },
  { mime = "application/oasis.opendocument.spreadsheet", use = "excel" },
  { mime = "text/csv", use = "excel" },

  # Word/ODF documents (must come BEFORE the generic "text/*" rule below:
  # RTF is often detected as text/rtf and would otherwise open in Neovim)
  { mime = "application/msword", use = "doc" },
  { mime = "application/openxmlformats-officedocument.wordprocessingml.{document,template}", use = "doc" },
  { mime = "application/ms-word.{document,template}.macroenabled.12", use = "doc" },
  { mime = "application/oasis.opendocument.text", use = "doc" },
  { mime = "application/oasis.opendocument.text-template", use = "doc" },
  { mime = "application/oasis.opendocument.text-flat-xml", use = "doc" },
  { mime = "application/rtf", use = "doc" },
  { mime = "text/rtf", use = "doc" },

  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "video" },
  { mime = "application/octet-stream", use = "video" },
  { mime = "audio/*", use = "audio" },
  { mime = "application/pdf", use = "pdf" },

  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = "extract" },
]

[opener]

edit = [{ run = 'kitty -e nvim %s', desc = "Neovim", block = true }]

image = [{ run = 'imv %s', desc = "Image Viewer (imv)", orphan = true }]

video = [{ run = 'celluloid %s', desc = "celluloid Player", orphan = true }]

audio = [
  { run = 'mpv --force-window=yes %s', desc = "celluloid Audio", orphan = true },
]

pdf = [{ run = 'evince %s', desc = "PDF Viewer", orphan = true }]

excel = [{ run = 'libreoffice %s', desc = "LibreOffice Calc", orphan = true }]

doc = [{ run = 'libreoffice %s', desc = "LibreOffice Writer", orphan = true }]

open = [{ run = 'xdg-open %s', desc = "System Default", orphan = true }]
