[manager]
show_hidden = true
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"

[preview]
max_width = 10000
max_height = 10000
# image_quality = 900

[plugin]
prepend_previewers = [
    { mime = "image/*", run = "image" },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
    {mime = "application/json", use = "edit"},
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "video" },
  { mime = "audio/*", use = "audio" },
  { mime = "application/pdf", use = "pdf" }
]

[opener]

edit = [
  { run = 'kitty -e nvim "$@"', desc = "Neovim", block = true }
]

image = [
  { run = 'imv "$@"', desc = "Image Viewer (imv)", orphan = true }
]

video = [
  { run = 'celluloid "$@"', desc = "celluloid Player", orphan = true }
]

audio = [
  { run = 'celluloid "$@"', desc = "celluloid Audio", orphan = true }
]

pdf = [
  { run = 'evince "$@"', desc = "PDF Viewer", orphan = true }
]

open = [
  { run = 'xdg-open "$@"', desc = "System Default", orphan = true }
]
