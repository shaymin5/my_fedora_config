[manager]
show_hidden = true
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"

[preview]
max_width = 10000
max_height = 10000
# image_quality = 900

[plugin]
prepend_previewers = [{ mime = "image/*", run = "image" }]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "video" },
  { mime = "audio/*", use = "audio" },
  { mime = "application/pdf", use = "pdf" },

  # Excel
  { mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = "excel" },
  { mime = "application/vnd.ms-excel", use = "excel" },
]

[opener]

edit = [{ run = 'kitty -e nvim %s', desc = "Neovim", block = true }]

image = [{ run = 'imv %s', desc = "Image Viewer (imv)", orphan = true }]

video = [{ run = 'celluloid %s', desc = "celluloid Player", orphan = true }]

audio = [
  { run = 'mpv --force-window=yes %s', desc = "celluloid Audio", orphan = true },
]

pdf = [{ run = 'evince %s', desc = "PDF Viewer", orphan = true }]

excel = [{ run = 'libreoffice %s', desc = "LibreOffice Calc", orphan = true }]

open = [{ run = 'xdg-open %s', desc = "System Default", orphan = true }]
